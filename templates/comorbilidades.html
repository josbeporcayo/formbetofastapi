<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  </head>
  <body>
    <nav class="navbar bg-body-tertiary bg-primary-subtle mb-3" >
      <div class="container-fluid">
        <a class="navbar-brand" href="#">
          <img src="https://www.einerd.com.br/wp-content/uploads/2014/09/bob-esponja-3.jpg" alt="Logo" width="90" height="70" class="d-inline-block align-text-top">
          Bootstrap
        </a>
      </div>
    </nav>
    <form class="container" action="/submitenfermedades" method="post">
      <div class="row mb-3" id="formbody">
        <div class="form-group mb-3" id="vaccinationStatusContainer">
          <label for="vaccinationStatus">¿El paciente tiene alguna enfermedad?</label>
          <select class="form-control" id="vaccinationStatus" name="vaccinationStatus">
              <option value="">Select an option</option>
              <option value="yes">Sí</option>
              <option value="no">No</option>
          </select>
        </div>

      </div>
      <div class="row mb-3">
        <button type="submit" class="btn btn-primary">Submit</button>
      </div>
    </form>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
    <script src="{{ url_for('static', path='js/statusvacu.js') }}"></script>
  </body>
</html>
